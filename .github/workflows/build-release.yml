name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  image-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64

  image-publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

  binaries:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries and archive
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -o galene .
          go build -trimpath -o galenectl-bin ./galenectl
          mkdir -p release
          cp galene release/galene
          cp galenectl-bin release/galenectl
          cp -R static release/static
          cp LICENCE README.md release/
          tar -C release -czf "galene-linux-${GOARCH}.tar.gz" .
          sha256sum "galene-linux-${GOARCH}.tar.gz" > "galene-linux-${GOARCH}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: galene-linux-${{ matrix.arch }}
          path: |
            galene-linux-${{ matrix.arch }}.tar.gz
            galene-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    needs: [binaries, image-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: galene-linux-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
